[package]
name = "text_based_roguelike_project"
version = "0.1.0"
author = "Camden Tuttle"
edition = "2024"

[dependencies]
rltk = { version = "0.8.0", features = ["serde"] }
specs = { version ="0.20.0", features = ["serde"]}
specs-derive = "0.4.1"
serde = {version = "1.0.93", features = ["derive"]}
serde_json = "1.0.39"
lazy_static = "1.4.0"
bitvec ={version = "1", features = ["serde"]}
regex = "1.3.6"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
panic = "unwind"

[profile.dev]
opt-level = 1

# Dependencies (rltk, specs, rayon, serde) are the hot code; optimize them even in dev builds.
[profile.dev.package."*"]
opt-level = 3