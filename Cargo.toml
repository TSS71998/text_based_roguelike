[package]
name = "text_based_roguelike_project"
version = "0.1.0"
authors = ["Camden Tuttle"]
edition = "2024"

[dependencies]
specs = { version = "0.20.0", default-features = false, features = ["serde"] }
specs-derive = "0.4.1"
serde = { version = "1.0.93", features = ["derive"] }
serde_json = "1.0.39"
bincode = "1.3"
miniz_oxide = "0.8"

# Window and input on desktop. X11 only on Linux (works under XWayland too): adds 6 crates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = { version = "0.28", default-features = false, features = ["x11"] }
 
# Browser canvas, input and clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "Element", "EventTarget", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "ImageData", "KeyboardEvent", "MouseEvent",
] }
 

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
panic = "unwind"

[profile.dev]
opt-level = 1

# Dependencies (specs, serde, miniz_oxide) are the hot code; optimize them even in dev builds.
[profile.dev.package."*"]
opt-level = 3